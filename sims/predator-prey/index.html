<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predation: Four Classic Papers</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2530;--muted:#5d6877;--line:#cfd6df;--accent:#1f6fbf;--soft:#eef2f6;--good:#1d7a3a;--bad:#b3261e;
--s1:#2a78d6;--s2:#d4561f;--s3:#178f64;--s4:#b07800;--s5:#c2477a;--s6:#6250d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d242d;--text:#e7ecf2;--muted:#9aa6b4;--line:#38424f;--accent:#6ab0f3;--soft:#262f3a;--good:#5fd38a;--bad:#ff8a80;
--s1:#5a9cf0;--s2:#f07a45;--s3:#2fc08b;--s4:#e0a82a;--s5:#e67aa6;--s6:#9a8cf0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif;padding:16px;line-height:1.45}
.wrap{max-width:1150px;margin:0 auto}
a{color:var(--accent)}
.back{font-size:.82rem;text-decoration:none}
h1{font-size:1.45rem;margin:4px 0 4px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:.95rem;margin:12px 0 6px}
p.sub{margin:0 0 10px;color:var(--muted);font-size:.93rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
nav.tabs button{font:inherit;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
section.panel{display:none}
section.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.layout>.card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.grid2>.card{margin-bottom:0}
button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select{font:inherit;font-size:.85rem;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;margin:9px 0 1px}
.ctrl label .val{font-weight:700;font-variant-numeric:tabular-nums}
.ctrl .hint{font-size:.75rem;color:var(--muted);margin:0 0 2px}
.ctrl h3:first-child{margin-top:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.check{display:flex;gap:6px;align-items:center;font-size:.86rem;margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 10px}
.tile{background:var(--soft);border-radius:10px;padding:8px 12px}
.tile .k{font-size:.76rem;color:var(--muted)}
.tile .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{fill:var(--muted);font-size:12px;font-family:system-ui,Arial,sans-serif}
.chart .ax{stroke:var(--line)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 3;opacity:.7}
.chart .lab{fill:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.msg{font-size:.9rem;background:var(--soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:8px}
.msg.good{border-left-color:var(--good)} .msg.bad{border-left-color:var(--bad)}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;overflow-x:auto}
details{margin-top:8px} details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.presets button{font-size:.8rem;padding:5px 10px}
/* quiz */
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:none}
.q p{margin:0 0 6px;font-weight:600}
.q .opts{display:flex;flex-direction:column;gap:5px}
.q .opts button{text-align:left}
.q .opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.q .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.q .fb{font-size:.88rem;margin-top:6px;min-height:1em}
canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--soft);touch-action:manipulation}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.grid2{grid-template-columns:1fr} body{padding:10px}}
.ctrl label.check{justify-content:flex-start;font-size:.86rem}
.ctrl .island h3{display:flex;align-items:center;gap:6px}
.rng{display:flex;gap:8px;align-items:center}
.rng input[type=range]{flex:1;min-width:0}
.box{width:78px;flex:none;font:inherit;font-size:.82rem;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.paper{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s4);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.paper .cite{font-size:.84rem;color:var(--muted);margin:6px 0 0}
.paper p{margin:6px 0}
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding:6px 0 6px 34px;border-top:1px solid var(--line);font-size:.9rem}
.steps li:first-child{border-top:none}
.steps li::before{content:counter(st);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.steps li button{margin-top:5px;font-size:.8rem;padding:4px 10px}
table.cmp{border-collapse:collapse;width:100%;font-size:.86rem}
table.cmp th,table.cmp td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{background:var(--soft)}
table.cmp td.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.traits input[type=number]{width:70px;font:inherit;font-size:.8rem;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps li::before{color:#0d1b2a}}
label.hasbox .val{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.layout>*{min-width:0}
/* paper tabs */
.pp-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.pp-sec>h2{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.pp-sec>h2 .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:.85rem;flex:none}
.pp-sec p,.pp-sec li{font-size:.93rem}
.pp-head{border-left:5px solid var(--s4)}
.pp-head h2{font-size:1.15rem;margin-bottom:4px}
.pp-head .cite{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.hyp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:6px}
.hyp div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem}
.pred-opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pred-opts button{text-align:left}
.pred-opts button.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:600}
.locked{position:relative}
.locked>.lockmsg{display:block;padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.locked>.lockbody{display:none}
.locked.unlocked>.lockmsg{display:none}
.locked.unlocked>.lockbody{display:block}
.discuss li{margin:6px 0}
.datatbl{margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pp-sec>h2 .num{color:#0d1b2a}}
.pp-sec .chart svg{max-width:760px;margin:0 auto}

#hBoard{max-width:460px;aspect-ratio:1/1;cursor:crosshair;background:#d8c9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #hBoard{background:#4a4234}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../../">&larr; All class simulations</a>
<h1>Predation: Four Classic Papers</h1>
<p class="sub">Each tab walks through one landmark study of predators and prey. Read the question, see how the study was designed, make a prediction, then look at what the authors found and decide what it means.</p>
<nav class="tabs">
  <button class="on" data-tab="t1">Paine 1966: keystone sea star</button>
  <button data-tab="t2">Huffaker 1958: mites</button>
  <button data-tab="t3">Krebs et al. 1995: hares</button>
  <button data-tab="t4">Holling 1959: discs</button>
</nav>
<section class="panel on" id="t1"></section>
<section class="panel" id="t2"></section>
<section class="panel" id="t3"></section>
<section class="panel" id="t4"></section>
</div>

<script>
/* ---------- shared helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS='http://www.w3.org/2000/svg';
function niceTicks(lo,hi,n=5){const span=hi-lo||1;let step=Math.pow(10,Math.floor(Math.log10(span/n)));const err=span/n/step;if(err>=7.5)step*=10;else if(err>=3.5)step*=5;else if(err>=1.5)step*=2;const out=[];for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out}
let _clip=0;
/* chart(svg,{xmin,xmax,ymin,ymax,xlab,ylab,series:[{pts,color,width,dash,fill}],points:[{x,y,color,r,ring}],texts:[{x,y,t,color,anchor}],logx,logy}) */
function chart(svg,o){
  const W=o.w||560,H=o.h||330,m={l:o.ml||56,r:14,t:12,b:44};
  const pw=W-m.l-m.r,ph=H-m.t-m.b;
  const tx=v=>o.logx?Math.log10(v):v, ty=v=>o.logy?Math.log10(v):v;
  const x0=tx(o.xmin),x1=tx(o.xmax),y0=ty(o.ymin),y1=ty(o.ymax);
  const X=v=>m.l+(tx(v)-x0)/(x1-x0)*pw, Y=v=>m.t+ph-(ty(v)-y0)/(y1-y0)*ph;
  const id='c'+(++_clip);
  let s=`<defs><clipPath id="${id}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  const xt=o.logx?logTicks(o.xmin,o.xmax):niceTicks(o.xmin,o.xmax,o.xticks||6), yt=o.logy?logTicks(o.ymin,o.ymax):niceTicks(o.ymin,o.ymax,5);
  xt.forEach(v=>{const x=X(v);if(x<m.l-1||x>m.l+pw+1)return;s+=`<line class="grid" x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ph}"/><text x="${x}" y="${m.t+ph+16}" text-anchor="middle">${fmtTick(v)}</text>`});
  yt.forEach(v=>{const y=Y(v);if(y<m.t-1||y>m.t+ph+1)return;s+=`<line class="grid" x1="${m.l}" x2="${m.l+pw}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${fmtTick(v)}</text>`});
  s+=`<rect class="ax" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none"/>`;
  s+=`<text class="lab" x="${m.l+pw/2}" y="${H-6}" text-anchor="middle">${o.xlab||''}</text>`;
  s+=`<text class="lab" transform="translate(14 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${o.ylab||''}</text>`;
  s+=`<g clip-path="url(#${id})">`;
  (o.series||[]).forEach(se=>{if(!se.pts||!se.pts.length)return;
    const d=se.pts.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(Math.max(o.logy?1e-9:-1e9,Math.min(p[1],o.ymax*50+1e6))).toFixed(1)).join('');
    if(se.fill)s+=`<path d="${d}" fill="${se.color}" fill-opacity="${se.fill}" stroke="none"/>`;
    else s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width||2.2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round" stroke-linecap="round" ${se.opacity?`opacity="${se.opacity}"`:''}/>`});
  (o.points||[]).forEach(p=>{if(!Number.isFinite(p.x)||!Number.isFinite(p.y))return;s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||5}" fill="${p.ring?'var(--card)':p.color}" stroke="${p.color}" stroke-width="${p.ring?2.5:1.5}"/>`});
  s+='</g>';
  (o.texts||[]).forEach(t=>{s+=`<text x="${X(t.x)+(t.dx||0)}" y="${Y(t.y)+(t.dy||0)}" text-anchor="${t.anchor||'start'}" style="fill:${t.color||'var(--text)'};font-weight:600">${t.t}</text>`});
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s;
  const inv=(cx,cy)=>{const r=svg.getBoundingClientRect(),sx=(cx-r.left)/r.width*W,sy=(cy-r.top)/r.height*H;
    let vx=x0+(sx-m.l)/pw*(x1-x0),vy=y0+(m.t+ph-sy)/ph*(y1-y0);if(o.logx)vx=10**vx;if(o.logy)vy=10**vy;return[vx,vy,sx>=m.l&&sx<=m.l+pw&&sy>=m.t&&sy<=m.t+ph]};
  return{X,Y,inv};
}
function logTicks(lo,hi){const out=[];for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++)out.push(10**e);return out}
function fmtTick(v){const a=Math.abs(v);if(a>=10000)return(v/1000)+'k';if(a>=1||a===0)return+v.toFixed(2)+'';return+v.toPrecision(2)+''}
function legend(el,items){el.innerHTML=items.map(([c,t,dash])=>`<span><i class="sw" style="background:${dash?'transparent':c};${dash?`border:2px dashed ${c}`:''}"></i>${t}</span>`).join('')}
/* sliders: <input type=range id=x data-d=decimals> with <span id=xV> */
function val(id){const b=document.getElementById(id+'Box');return b&&b.value!==''?+b.value:+document.getElementById(id).value}
function showVals(){$$('input[type=range]').forEach(r=>{const b=document.getElementById(r.id+'Box'),v=val(r.id);if(b&&document.activeElement!==b&&+b.value!==v)b.value=v;const o=$('#'+r.id+'V');if(o)o.textContent=(r.dataset.pre||'')+v.toFixed(+(r.dataset.d||0))+(r.dataset.suf||'')})}
/* typed-value boxes beside every slider (skip with data-nobox) */
function addBoxes(root=document){$$('input[type=range]:not([data-nobox])',root).forEach(r=>{if(document.getElementById(r.id+'Box'))return;
  const w=document.createElement('div');w.className='rng';r.parentNode.insertBefore(w,r);w.appendChild(r);
  const b=document.createElement('input');b.type='number';b.className='box';b.id=r.id+'Box';b.step='any';b.value=r.value;
  const lab=r.labels&&r.labels[0];if(lab)lab.classList.add('hasbox');let nm=lab?lab.cloneNode(true):null;if(nm)$$('.val',nm).forEach(x=>x.remove());
  b.setAttribute('aria-label',(nm?nm.textContent.replace(/\s+/g,' ').trim():r.id)+', type an exact value');b.title='Type an exact value';w.appendChild(b);
  b.addEventListener('change',()=>{let v=+b.value;if(!Number.isFinite(v)){b.value=r.value;return}
    const lo=b.dataset.min!==undefined?+b.dataset.min:+r.min,hi=b.dataset.max!==undefined?+b.dataset.max:+r.max;v=Math.min(hi,Math.max(lo,v));b.value=v;
    r._fromBox=true;r.value=v;r.dispatchEvent(new Event('input',{bubbles:true}));r._fromBox=false})})}
document.addEventListener('input',e=>{const r=e.target;if(r.type!=='range'||r._fromBox)return;const b=document.getElementById(r.id+'Box');if(b)b.value=r.value},true);
function setSliders(obj){Object.entries(obj).forEach(([k,v])=>{const e=$('#'+k);if(!e)return;if(e.type==='checkbox')e.checked=!!v;else{e.value=v;const b=document.getElementById(k+'Box');if(b)b.value=v}});showVals()}
/* tabs */
function initTabs(RENDER){let cur=$('nav.tabs button.on').dataset.tab;
  $$('nav.tabs button').forEach(b=>b.onclick=()=>{$$('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('section.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.tab));cur=b.dataset.tab;if(RENDER[cur])RENDER[cur]();try{history.replaceState(null,'','#'+cur)}catch(e){}});
  const h=location.hash.slice(1);const b=h&&$(`nav.tabs button[data-tab="${h}"]`);if(b)b.click();
  return()=>cur}
/* quiz */
function quiz(el,QS){el.innerHTML=QS.map((q,i)=>`<div class="q" data-i="${i}"><p>${i+1}. ${q.q}</p><div class="opts">${q.opts.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div><div class="fb" aria-live="polite"></div></div>`).join('')+'<p class="small muted score"></p>';
  const got={};
  $$('.q',el).forEach(d=>{const q=QS[+d.dataset.i];$$('.opts button',d).forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q.a;
    $$('.opts button',d).forEach(x=>x.classList.remove('right','wrong'));b.classList.add(ok?'right':'wrong');
    $('.fb',d).innerHTML=(ok?'<b class="ok" style="color:var(--good)">Correct.</b> ':'<b style="color:var(--bad)">Not quite.</b> ')+(ok?q.why:(q.hint||'Try again, or look back at the results.'));
    if(!(d.dataset.i in got))got[d.dataset.i]=ok;$('.score',el).textContent=`First-try score: ${Object.values(got).filter(Boolean).length} of ${Object.keys(got).length} answered (${QS.length} total).`})})}
/* bar chart: bars(svg,{cats:[...],series:[{name,color,vals:[...]}],ymax,ylab,xlab,w,h,fmt}) */
function bars(svg,o){
  const W=o.w||560,H=o.h||330,m={l:o.ml||56,r:14,t:16,b:o.mb||52},pw=W-m.l-m.r,ph=H-m.t-m.b,n=o.cats.length,k=o.series.length;
  const ymax=o.ymax||Math.max(...o.series.flatMap(s=>s.vals))*1.15||1,Y=v=>m.t+ph-v/ymax*ph,gw=pw/n,bw=Math.min(60,gw*0.8/k);
  let s='';niceTicks(0,ymax,5).forEach(v=>{const y=Y(v);s+=`<line class="grid" x1="${m.l}" x2="${m.l+pw}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${fmtTick(v)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${m.l+pw}" y1="${m.t+ph}" y2="${m.t+ph}"/>`;
  o.cats.forEach((c,i)=>{const cx=m.l+gw*(i+0.5);
    o.series.forEach((se,j)=>{const v=se.vals[i];if(v==null||!Number.isFinite(v))return;const x=cx-k*bw/2+j*bw,y=Y(v);
      s+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${m.t+ph-y}" fill="${se.color}" rx="2" ${se.hatch?'fill-opacity=".45" stroke="'+se.color+'" stroke-width="1.5" stroke-dasharray="4 2"':''}/>`;
      s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:var(--text);font-size:11px">${o.fmt?o.fmt(v):fmtTick(+v.toFixed(2))}</text>`});
    String(c).split('\n').forEach((line,li)=>{s+=`<text x="${cx}" y="${m.t+ph+16+li*13}" text-anchor="middle">${line}</text>`})});
  s+=`<text class="lab" transform="translate(14 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${o.ylab||''}</text>`;
  if(o.xlab)s+=`<text class="lab" x="${m.l+pw/2}" y="${H-6}" text-anchor="middle">${o.xlab}</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s}

/* ---------- paper-tab engine ----------
 P = {id, cite, doi, why, question, hyps:[[title,text]], design(html), predict:{q,opts:[text],note?:[fb per option]},
      results(html), afterResults(fn), found(html), interpret:[quiz items], model(html)?, afterModel(fn)?, discuss:[...] } */
function paperTab(el,P){
  const sec=(n,t,body,cls='')=>`<div class="pp-sec ${cls}"><h2>${n?`<span class="num">${n}</span>`:''}${t}</h2>${body}</div>`;
  let n=1,h='';
  h+=`<div class="pp-sec pp-head"><h2>${P.title}</h2><p style="margin:0">${P.why}</p><p class="cite">${P.cite}${P.doi?` <a href="https://doi.org/${P.doi}" target="_blank" rel="noopener">doi:${P.doi}</a>`:''}${P.url?` <a href="${P.url}" target="_blank" rel="noopener">Read it</a>`:''}</p></div>`;
  h+=sec(n++,'The question',`<p>${P.question}</p>${P.hyps?`<div class="hyp">${P.hyps.map(x=>`<div><b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div>`:''}`);
  h+=sec(n++,'What they did',P.design);
  h+=sec(n++,'Your prediction',`<p>${P.predict.q}</p><div class="pred-opts" id="${P.id}-pred">${P.predict.opts.map((o,i)=>`<button data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div><div class="msg small" id="${P.id}-predfb" style="display:none" aria-live="polite"></div>`);
  h+=sec(n++,'What they found',`<div class="locked" id="${P.id}-lock"><div class="lockmsg">Make a prediction above to unlock the results.</div><div class="lockbody">${P.results}<div class="msg" style="margin-top:10px">${P.found}</div></div></div>`);
  h+=sec(n++,'Interpret the results',`<div id="${P.id}-quiz"></div>`);
  if(P.model)h+=sec(n++,P.modelTitle||'Try the model',P.model);
  h+=sec(n++,'Discuss',`<ol class="discuss">${P.discuss.map(d=>`<li>${d}</li>`).join('')}</ol>`);
  el.innerHTML=h;
  quiz($(`#${P.id}-quiz`),P.interpret);
  let shown=false;
  $$(`#${P.id}-pred button`).forEach(b=>b.onclick=()=>{
    $$(`#${P.id}-pred button`).forEach(x=>{x.classList.toggle('picked',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});
    const fb=$(`#${P.id}-predfb`);fb.style.display='block';fb.innerHTML=`<b>Prediction saved.</b> ${P.predict.note?P.predict.note[+b.dataset.i]:''} Scroll down to compare with what the authors found.`;
    const L=$(`#${P.id}-lock`);L.classList.add('unlocked');if(!shown){shown=true;if(P.afterResults)P.afterResults()}});
  if(P.afterModel)P.afterModel();
  return{redraw:()=>{if(shown&&P.afterResults)P.afterResults();if(P.afterModel)P.afterModel()}};
}

(function(){
const tabs={};

/* =================== 1. PAINE =================== */
tabs.t1=paperTab($('#t1'),{id:'p',title:'Food web complexity and species diversity',
  why:'The experiment behind the keystone species idea. It showed that one predator can control the diversity of a whole community. It is the most-cited data paper ever published in <i>The American Naturalist</i>.',
  cite:'Paine, R. T. (1966). Food web complexity and species diversity. <i>The American Naturalist</i> 100: 65–75.',
  question:'Why do some places have more species than others? Paine proposed that <b>local diversity depends on how well predators stop any one prey species from taking over the space</b> that everything else needs. On rocky shores, that space is bare rock.',
  hyps:[['Predators reduce diversity','Predators kill prey, so removing them should let more species survive.'],['Predators maintain diversity','A predator that eats the best competitor for space keeps that species from crowding everything else out.']],
  design:`<p>At Mukkaw Bay, on the outer coast of Washington, Paine first watched what predators ate. The ochre sea star <i>Pisaster ochraceus</i> was the top predator (he recorded 1,049 of its meals); the whelk <i>Thais</i> was the other main carnivore (287 meals). Both ate many barnacles, and <i>Pisaster</i> also ate mussels, chitons, limpets, and snails.</p>
    <p>Then, starting in June 1963, he pried every <i>Pisaster</i> off a strip of shore about 8 m long and 2 m tall and threw them into deeper water, again and again. A neighboring strip was left alone as a <b>control</b>. He counted the species in both.</p>
    <p>He also compared the food web at Mukkaw Bay with similar webs in the Gulf of California and Costa Rica.</p>`,
  predict:{q:'What happened to the number of species where <i>Pisaster</i> was removed?',opts:['It went up: with no sea stars eating them, more prey species survived.','It stayed the same.','It went down: one prey species took over the space.','Every species disappeared.']},
  results:`<div class="grid2"><div class="chart"><h3>Species in the study area</h3><svg id="pR1"></svg></div><div class="chart"><h3>Size of the food web</h3><svg id="pR2"></svg></div></div>
    <div class="legend" id="pLeg"></div>
    <h3>What happened in the removal area</h3><ol class="small"><li>The acorn barnacle <i>Balanus glandula</i> settled across the area and soon covered roughly 60–80% of the space.</li><li>Within about a year, mussels (<i>Mytilus</i>) and goose barnacles (<i>Mitella</i>) were crowding the acorn barnacles out.</li><li>Algae, chitons, limpets, and other species lost their space and disappeared from the area.</li></ol>`,
  found:'Removing <i>Pisaster</i> <b>reduced</b> diversity, from 15 species to 8. With the sea star gone, mussels and goose barnacles monopolized the rock. The control area stayed about the same. Paine concluded that the predator maintained diversity by eating the dominant competitor. A few years later he called such species <b>keystone species</b>. Food webs with more predator species, like the Gulf of California web, also held more species overall.',
  afterResults:()=>{
    bars($('#pR1'),{cats:['Control\n(sea stars present)','Removal\n(sea stars removed)'],series:[{color:'var(--s3)',vals:[15,8]}],ymax:18,ylab:'Number of species',w:420,h:300});
    bars($('#pR2'),{cats:['Mukkaw Bay','Gulf of California'],series:[{color:'var(--s1)',vals:[13,45]},{color:'var(--s2)',vals:[2,11]}],ymax:50,ylab:'Number of species',w:420,h:300});
    legend($('#pLeg'),[['var(--s1)','All species in the food web'],['var(--s2)','Carnivore species']]);
    $('#pR1').setAttribute('aria-label','Bar chart: 15 species in the control area, 8 in the removal area.');$('#pR2').setAttribute('aria-label','Bar chart: Mukkaw Bay food web had 13 species including 2 carnivores; Gulf of California web had 45 species including 11 carnivores.')},
  interpret:[
    {q:'Why did removing a predator DECREASE the number of prey species?',opts:['The predator was also a prey species','Without the predator, the best competitors for space (mussels, goose barnacles) took over','The removal area was smaller','Sea stars fertilize the rocks'],a:1,why:'Pisaster ate the dominant space competitors. Without it, they monopolized the rock and excluded other species.'},
    {q:'What was the purpose of the control area?',opts:['To give the sea stars somewhere to live','To show what would have happened without the removal, so changes could be blamed on the removal','To count more species','It was not needed'],a:1,why:'Without a control, changes over time (weather, a good settlement year) could be mistaken for effects of removing the predator.'},
    {q:'What makes Pisaster a "keystone" species?',opts:['It is the most abundant species','Its effect on the community is much larger than its abundance would suggest','It is the largest species','It eats only one prey'],a:1,why:'Like the keystone of an arch, removing it causes the structure (here, the diverse community) to collapse.'}],
  discuss:['Paine studied one removal plot and one control. What would you add to make the conclusion stronger?','Predators increase diversity in this system. Can you think of a system where removing a predator might increase diversity instead?','Sea star wasting disease killed huge numbers of <i>Pisaster</i> along the Pacific coast beginning in 2013. Based on this paper, what would you predict for those shores?']});

/* =================== 2. HUFFAKER =================== */
tabs.t2=paperTab($('#t2'),{id:'h',title:'Experimental studies on predation: dispersion factors and predator–prey oscillations',
  why:'A famous lab test of whether predators and prey can persist together, and of how habitat structure keeps them from going extinct.',
  cite:'Huffaker, C. B. (1958). Experimental studies on predation: dispersion factors and predator–prey oscillations. <i>Hilgardia</i> 27: 343–383.',doi:'10.3733/hilg.v27n14p343',
  question:'Gause had found that when predators and prey were put together in a simple container, the predators ate all the prey and then starved. Simple models predicted cycles that should go on forever. <b>Can predators and prey persist together, and does the structure of the environment matter?</b>',
  hyps:[['Overexploitation is inevitable','Predators always find and eat all prey, so both go extinct.'],['Space can save them','In a large, patchy environment, prey can escape to places predators have not reached yet, so the system can keep cycling.']],
  design:`<p>Huffaker used the six-spotted mite (<i>Eotetranychus sexmaculatus</i>), which eats oranges, as prey, and the predatory mite <i>Typhlodromus occidentalis</i>. He built "universes" on trays of oranges and rubber balls. By wrapping oranges in paper and wax, he controlled how much food each orange offered, and he arranged them in different patterns.</p>
    <ul class="small"><li><b>Simple universes:</b> a few oranges, grouped together or spread among rubber balls.</li><li><b>Complex universe:</b> 120 oranges, each with only a small area exposed, with petroleum-jelly barriers that slowed the walking predators, and small upright sticks that let the prey launch themselves on silk threads and drift to new oranges.</li></ul>
    <p>He counted both mites on every orange over many weeks.</p>`,
  predict:{q:'In which universe do you expect predators and prey to last the longest?',opts:['A few oranges grouped together, where prey are easy to find','A few oranges spread far apart among rubber balls','The large, complex universe with barriers that slowed predators and posts that helped prey disperse','They will go extinct at the same time everywhere']},
  results:`<p class="small muted">Huffaker reported his results as graphs of mite counts over time. The diagrams below are <b>schematic sketches of the pattern he described</b>, not his data.</p>
    <div class="grid2"><div class="chart"><h3>Simple universe (schematic)</h3><svg id="hS"></svg></div><div class="chart"><h3>Complex universe (schematic)</h3><svg id="hC"></svg></div></div><div class="legend" id="hLeg"></div>`,
  found:'In the simple universes, the prey increased, the predators followed and ate them all, and then the predators starved: one oscillation and both were gone. In the large, complex universe, predators could not reach every orange at once, and prey kept colonizing oranges the predators had not found. The two species went through <b>three successive oscillations</b> before the predators finally overexploited the prey. Huffaker concluded that a heterogeneous environment, where prey can find temporary refuges, makes predator–prey systems more stable.',
  afterResults:()=>{const t=[];for(let i=0;i<=200;i++)t.push(i);
    const bump=(x,c,w,h)=>h*Math.exp(-(((x-c)/w)**2));
    const sP=t.map(x=>[x,x<70?bump(x,30,14,100):0]),sD=t.map(x=>[x,x<80?bump(x,42,12,40):0]);
    chart($('#hS'),{xmin:0,xmax:200,ymin:0,ymax:110,w:440,h:280,xlab:'Time →',ylab:'Mites',xticks:2,series:[{pts:sP,color:'var(--s3)',width:2.4},{pts:sD,color:'var(--s2)',width:2.4}]});
    const cP=t.map(x=>[x,bump(x,25,10,90)+bump(x,85,12,80)+bump(x,145,12,70)]),cD=t.map(x=>[x,x<185?bump(x,38,10,30)+bump(x,98,11,28)+bump(x,158,11,30):0]);
    chart($('#hC'),{xmin:0,xmax:200,ymin:0,ymax:110,w:440,h:280,xlab:'Time →',ylab:'Mites',xticks:2,series:[{pts:cP,color:'var(--s3)',width:2.4},{pts:cD,color:'var(--s2)',width:2.4}]});
    legend($('#hLeg'),[['var(--s3)','Prey mite'],['var(--s2)','Predatory mite']]);
    $('#hS').setAttribute('aria-label','Schematic: in a simple universe, prey rise and fall once, predators follow, and both reach zero.');
    $('#hC').setAttribute('aria-label','Schematic: in the complex universe, prey and predators go through three oscillations, with predator peaks after prey peaks, before ending.')},
  interpret:[
    {q:'What feature of the complex universe was most important for persistence?',opts:['More total food','Patchiness: barriers and dispersal routes kept predators from reaching all prey at once','Warmer temperature','Fewer predators at the start'],a:1,why:'Huffaker emphasized dispersion: prey could escape to unoccupied oranges while predators were slowed by barriers.'},
    {q:'Even the complex universe eventually crashed. What does that suggest?',opts:['Huffaker made an error','Real systems may need even larger or more complex landscapes, or other stabilizing factors, to persist indefinitely','Predators always win','Oranges are poor habitat'],a:1,why:'Three oscillations is longer persistence, not indefinite persistence. Huffaker himself suggested that more complexity might allow more oscillations.'},
    {q:'How does this connect to conservation today?',opts:['It doesn\'t','Connected networks of habitat patches can let populations persist when single patches would fail','Predators should always be removed','Small habitats are best'],a:1,why:'The idea that populations persist across a network of patches, even when local populations go extinct, became central to metapopulation ecology and reserve design.'}],
  discuss:['Why did Huffaker use rubber balls between the oranges instead of just leaving empty space?','Compare this with Krebs\'s hare study (tab 3). In which system is the environment more "complex" in Huffaker\'s sense?','How could you test Huffaker\'s idea in a field system, such as aphids and ladybugs on plants?']});

/* =================== 3. KREBS =================== */
tabs.t3=paperTab($('#t3'),{id:'k',title:'Impact of food and predation on the snowshoe hare cycle',
  why:'One of the largest field experiments in ecology. It tested whether a famous 10-year population cycle is driven by food, by predators, or by both.',
  cite:'Krebs, C. J., S. Boutin, R. Boonstra, A. R. E. Sinclair, J. N. M. Smith, M. R. T. Dale, K. Martin, &amp; R. Turkington (1995). Impact of food and predation on the snowshoe hare cycle. <i>Science</i> 269: 1112–1115.',doi:'10.1126/science.269.5227.1112',
  question:'Snowshoe hares in the boreal forest rise and crash about every 10 years, and lynx follow them. <b>What causes the cycle: running out of food, being eaten by predators, or an interaction of the two?</b>',
  hyps:[['Food','Hares eat their winter food down at the peak, then starve and crash.'],['Predators','Predators increase after hares do and then drive hares down.'],['Food × predators','Both act together, through the plant–hare–predator food chain.']],
  design:`<p>Near Kluane Lake in the Yukon, the team set up 1-km² blocks of forest and ran them for 8 years in a <b>factorial design</b>, which crosses two treatments so their combined effect can be measured:</p>
    <table class="cmp" style="max-width:560px"><tr><th></th><th>No added food</th><th>Food added</th></tr><tr><th>Predators present</th><td>Control</td><td>Food</td></tr><tr><th>Mammal predators fenced out</th><td>Fence</td><td>Food + fence</td></tr></table>
    <p>The electric fences kept out lynx and coyotes, but owls and hawks could still fly in. Two more blocks were fertilized to boost plant growth. Hares were live-trapped twice a year to estimate density.</p>`,
  predict:{q:'Food tripled hare density and the fence doubled it. What do you predict for the food + fence plot?',opts:['About 5× (3 + 2: the effects add)','About 6× (3 × 2: the effects multiply)','More than 6× (the effects reinforce each other)','No change: the effects cancel out']},
  results:`<div class="chart"><svg id="kR"></svg></div>
    <p class="small muted">Hare density during the peak and decline of the cycle, relative to control plots (from the paper's abstract). Fertilized plots: plants grew more, but hare density did not increase.</p>`,
  found:'During the peak and decline, the predator fence <b>doubled</b> hare density, added food <b>tripled</b> it, and the two together increased it <b>11-fold</b>, more than adding or multiplying the separate effects would predict. Fertilizer made plants grow but did not increase hares. The authors concluded that neither food nor predation alone explains the cycle: it comes from an interaction among three levels of the food chain (plants, hares, and predators).',
  afterResults:()=>{bars($('#kR'),{cats:['Control','Fence','Food','Food + fence','If effects\nadded (5×)','If effects\nmultiplied (6×)'],series:[{color:'var(--s3)',vals:[1,2,3,11,5,6]}],ymax:12.5,ylab:'Hare density relative to control',w:720,h:340,mb:60,fmt:v=>v+'×'});
    $('#kR').setAttribute('aria-label','Bar chart of hare density relative to control: control 1, fence 2, food 3, food plus fence 11. For comparison, adding the effects predicts 5 and multiplying predicts 6.');
    const bars2=$$('#kR rect');if(bars2[4])bars2[4].setAttribute('fill-opacity','.35');if(bars2[5])bars2[5].setAttribute('fill-opacity','.35')},
  interpret:[
    {q:'Why was a factorial design (all four combinations) necessary?',opts:['To use more land','To measure whether food and predators interact, which you cannot see if you test each one separately','To make the experiment shorter','It was not necessary'],a:1,why:'Only by including the food + fence combination could the team see that the combined effect was larger than expected from each treatment alone.'},
    {q:'The fences did not stop owls and hawks. How does that affect the interpretation?',opts:['It makes the fence effect an underestimate of the full effect of predators','It means predators had no effect','It means food was not important','It doesn\'t matter'],a:0,why:'Some predation continued inside the fences, so removing all predators would probably have had an even larger effect.'},
    {q:'Fertilizer increased plant growth but not hares. What does that suggest?',opts:['Plant quantity alone was not limiting hares','Hares don\'t eat plants','Fertilizer is toxic to hares','The study failed'],a:0,why:'More plant growth did not translate into more hares, while added food did. The kind of food available in winter, not just plant growth, mattered.'}],
  discuss:['Even food + fence plots eventually declined. What does that tell you about what drives the cycle?','Predators may also affect hares through fear: stressed hares have fewer young. How could that help explain the 11-fold effect?','Why might a lab study (like Huffaker\'s) and a field study (like this one) lead to different conclusions about predators?']});

/* =================== 4. HOLLING =================== */
let hState=null;
tabs.t4=paperTab($('#t4'),{id:'d',title:'Some characteristics of simple types of predation and parasitism',
  why:'Introduced handling time and the "disc equation," the most widely used description of how much a predator eats.',
  cite:'Holling, C. S. (1959). Some characteristics of simple types of predation and parasitism. <i>The Canadian Entomologist</i> 91: 385–398.',
  question:'How does the number of prey a predator eats change as prey become more common? Holling had seen that small mammals eating sawfly cocoons did not keep eating more and more as cocoons got denser. <b>What sets the limit?</b>',
  hyps:[['Straight line','Prey eaten rises in proportion to prey density.'],['Leveling off','Each prey takes time to handle, and that time cuts into searching, so feeding levels off.']],
  design:`<p>Holling built a model predator: a blindfolded assistant tapped a tabletop with a finger to "search" for sandpaper discs. Each time the assistant found a disc, it had to be picked up and set aside (the "handling time") before searching could resume. Trials lasted a fixed amount of time, with discs scattered at different densities.</p>
    <p>From the results he derived the <b>disc equation</b>: prey eaten = aNT / (1 + a·h·N), where N is prey density, T is the time available, a is the search rate, and h is the handling time per prey.</p>`,
  predict:{q:'As disc density increases from a few to many, what happens to the number of discs found per minute?',opts:['It rises in a straight line forever','It rises quickly at first, then levels off','It stays the same at all densities','It falls as discs get more common']},
  results:`<div class="chart"><svg id="dR"></svg></div><p class="small muted">The general shape Holling found, drawn from the disc equation (not his exact data). Run your own version of the experiment below.</p>`,
  found:'The number of discs found rose with density but leveled off. At high densities, the assistant spent most of the trial picking up discs rather than searching. Holling called this a <b>type II functional response</b> and showed that it follows from just two things: search rate and handling time. He also described type I (straight-line) and type III (S-shaped) responses.',
  afterResults:()=>{const a=0.04,h=2,T=60,xs=[];for(let i=0;i<=100;i++)xs.push(i);
    chart($('#dR'),{xmin:0,xmax:100,ymin:0,ymax:32,w:620,h:300,xlab:'Discs on the table',ylab:'Discs found in 1 minute',series:[{pts:xs.map(n=>[n,a*n*T/(1+a*h*n)]),color:'var(--s1)',width:2.8},{pts:[[0,T/h],[100,T/h]],color:'var(--muted)',dash:'5 4',width:1.4}],texts:[{x:98,y:T/h,t:'maximum = T / h',color:'var(--muted)',anchor:'end',dy:-6}]});
    $('#dR').setAttribute('aria-label','Curve of discs found per minute against disc density, rising and leveling off toward a maximum set by handling time.')},
  interpret:[
    {q:'In the disc equation, what sets the maximum number of prey eaten?',opts:['Search rate a','Handling time h (maximum = T/h)','Prey density','The size of the table'],a:1,why:'When prey are everywhere, no search time is needed, and the predator is limited by how long it takes to handle each prey.'},
    {q:'With a type II response, what happens to each individual prey\'s chance of being eaten as prey become more common?',opts:['It goes up','It goes down','It stays the same','It becomes zero'],a:1,why:'Prey eaten levels off while prey density keeps rising, so the proportion eaten falls: there is "safety in numbers."'},
    {q:'Why use a blindfolded person instead of a real animal?',opts:['Animals cannot be studied','To control search rate and handling time exactly and test the logic of the model','People are better predators','It was cheaper'],a:1,why:'A simple, controlled "predator" let Holling isolate the effect of handling time on feeding rate.'}],
  modelTitle:'Run Holling\'s experiment yourself',
  model:`<p class="small">Click the board to "tap" for hidden discs. When you find one, you must wait out the handling time before searching again. Run a 30-second trial at each density, then fit the disc equation to your data.</p>
    <div class="layout"><div class="ctrl">
      <label for="hN">Discs on the board <span class="val" id="hNV"></span></label><input type="range" id="hN" min="2" max="60" step="1" value="10">
      <label for="hH">Handling time (seconds) <span class="val" id="hHV"></span></label><input type="range" id="hH" min="0.5" max="5" step="0.5" value="2" data-d="1">
      <div class="row"><button class="primary" id="hGo">Start 30-second trial</button><button id="hClear">Clear my data</button></div>
      <div class="tiles"><div class="tile"><div class="k">Time left</div><div class="v" id="hTime">30</div></div><div class="tile"><div class="k">Found</div><div class="v" id="hFound">0</div></div></div>
      <p class="hint" id="hStat">Discs are invisible until you click on one.</p>
    </div><div><canvas id="hBoard" width="460" height="460"></canvas>
      <div class="chart"><h3>Your data and the fitted disc equation</h3><svg id="hFit"></svg></div><div class="msg small" id="hMsg">Run trials at several densities (for example 4, 10, 20, 40, 60).</div></div></div>`,
  afterModel:()=>{if(!$('#hNBox'))addBoxes($('#t4'));
    const cv=$('#hBoard'),ctx=cv.getContext('2d');let data=[],discs=[],t0=0,found=0,busyTill=0,running=false,timer=null;
    const R=18;
    const draw=()=>{ctx.clearRect(0,0,460,460);discs.forEach(d=>{if(d.found){ctx.fillStyle='rgba(120,120,120,.35)';ctx.beginPath();ctx.arc(d.x,d.y,R,0,7);ctx.fill()}});
      if(running&&performance.now()<busyTill){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,460,460);ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('Handling…',230,235)}
      cv.setAttribute('aria-label',`Search board with ${discs.length} hidden discs. ${found} found so far.`)};
    const fit=()=>{showVals();if(!data.length){chart($('#hFit'),{xmin:0,xmax:60,ymin:0,ymax:20,w:460,h:280,xlab:'Discs on the board',ylab:'Found in 30 s'});return}
      let best=null;for(let a=0.001;a<=0.2;a*=1.08)for(let h=0.2;h<=8;h+=0.1){const e=data.reduce((s,[n,y])=>s+(a*n*30/(1+a*h*n)-y)**2,0);if(!best||e<best.e)best={a,h,e}}
      const xs=[];for(let i=0;i<=60;i++)xs.push(i);
      chart($('#hFit'),{xmin:0,xmax:60,ymin:0,ymax:Math.max(10,...data.map(d=>d[1]))*1.2,w:460,h:280,xlab:'Discs on the board',ylab:'Found in 30 s',series:[{pts:xs.map(n=>[n,best.a*n*30/(1+best.a*best.h*n)]),color:'var(--s1)',width:2.4}],points:data.map(([n,y])=>({x:n,y,color:'var(--s2)',r:5}))});
      $('#hFit').setAttribute('aria-label',`Your ${data.length} trials with a fitted curve: search rate ${f(best.a,3)}, handling time ${f(best.h,1)} seconds.`);
      $('#hMsg').innerHTML=`Fitted search rate a = <b>${f(best.a,3)}</b> (share of the board searched per second); fitted handling time h = <b>${f(best.h,1)} s</b> (the real handling time was ${val('hH')} s, plus however long you took to click). ${data.length<4?'Add more densities for a better fit.':'Did your curve level off?'}`};
    $('#hGo').onclick=()=>{if(running)return;const n=val('hN');discs=[];for(let i=0;i<n;i++){let x,y,ok;let tries=0;do{x=R+Math.random()*(460-2*R);y=R+Math.random()*(460-2*R);ok=discs.every(d=>Math.hypot(d.x-x,d.y-y)>2*R);tries++}while(!ok&&tries<200);discs.push({x,y,found:false})}
      found=0;running=true;t0=performance.now();busyTill=0;$('#hFound').textContent=0;$('#hStat').textContent='Searching…';
      timer=setInterval(()=>{const left=Math.max(0,30-(performance.now()-t0)/1000);$('#hTime').textContent=f(left,0);draw();
        if(left<=0){clearInterval(timer);running=false;data.push([n,found]);$('#hStat').textContent=`Trial done: ${found} discs at density ${n}.`;draw();fit()}},100)};
    cv.onclick=e=>{if(!running||performance.now()<busyTill)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*460,y=(e.clientY-r.top)/r.height*460;
      const d=discs.find(d=>!d.found&&Math.hypot(d.x-x,d.y-y)<R);if(d){d.found=true;found++;$('#hFound').textContent=found;busyTill=performance.now()+val('hH')*1000;
        setTimeout(()=>{d.x=R+Math.random()*(460-2*R);d.y=R+Math.random()*(460-2*R);d.found=false;draw()},val('hH')*1000)}draw()};
    $('#hClear').onclick=()=>{data=[];fit()};$('#hN').oninput=showVals;$('#hH').oninput=showVals;draw();fit()},
  discuss:['In this version, found discs are put back so density stays the same. The disc equation assumes prey density does not change during a trial. What would change if found prey were not replaced?','What would a type III response look like on the board? What behavior would cause it?','How could you measure handling time for a real predator, such as a snake eating mice or a bat eating moths?']});

initTabs({t1:()=>tabs.t1.redraw(),t2:()=>tabs.t2.redraw(),t3:()=>tabs.t3.redraw(),t4:()=>tabs.t4.redraw()});
})();
</script>

<script>
(function(){
  var C = window.A11Y || {};
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

    var out = dflt;
    if (!map) return out;
    Object.keys(map).forEach(function(sel){
      if (el.matches(sel)){ var v = map[sel]; out = (typeof v === 'function') ? v(el, out) : v; }
    });
    return out;
  }

  if (C.css){ var st = document.createElement('style'); st.textContent = C.css; document.head.appendChild(st); }

  if (!document.querySelector('main,[role="main"]')){
    var m = document.querySelector(C.main || '.wrap');
    if (m) m.setAttribute('role', 'main');
  }

  var ann = document.createElement('div');
  ann.className = 'sr-only'; ann.setAttribute('aria-live', 'polite'); ann.setAttribute('aria-atomic', 'true');
  document.body.appendChild(ann);
  var lastAct = -1e9;
  ['input', 'change', 'click', 'keydown'].forEach(function(e){
    document.addEventListener(e, function(){ lastAct = performance.now(); }, true);
  });
  function say(t){ ann.textContent = ''; setTimeout(function(){ ann.textContent = t; }, 50); }
  window.A11Y_say = say;

  /* Accessible names and spoken values for sliders, dropdowns and text fields */

    while (p){ if (p.tagName === 'LABEL') return p; p = p.previousElementSibling; }
    return null;
  }
  $$('input[type="range"],select,input[type="number"],input[type="text"],input[type="search"],textarea').forEach(function(el){
    var lab = labelFor(el);
    var vals = lab ? $$('[id],.val', lab).filter(function(x){ return x !== el && !x.contains(el) && !el.contains(x) && x.tagName !== 'INPUT' && x.tagName !== 'SELECT'; }) : [];
    var name = null;
    if (lab){
      var cl = lab.cloneNode(true);
      $$('[id],.val,input,select,textarea', cl).forEach(function(x){ x.remove(); });
      var t = clean(cl.textContent);
      var associated = el.labels && el.labels.length;
      if (t && (vals.length || !associated)) name = t;
    }
    if (!name && !lab && !el.getAttribute('aria-label') && el.placeholder) name = clean(el.placeholder.replace(/\(.*?\)|…|\.\.\./g, ''));

    if (name) el.setAttribute('aria-label', name);

    if (el.type === 'range'){
      var unit = matchCfg(C.units, el, '');
      var upd = function(){
        var t = vals.map(function(v){ return clean(v.textContent); }).filter(Boolean).join(' ');
        if (!t) t = el.value;
        if (unit && t.indexOf(unit.trim()) < 0) t += ' ' + unit;
        if (t && t !== el.value) el.setAttribute('aria-valuetext', t); else el.removeAttribute('aria-valuetext');

      el.addEventListener('input', function(){ setTimeout(upd, 0); });
      upd();
    }
  });

  /* Tabs: proper tab roles, selected state, and arrow-key navigation */
  $$('nav').forEach(function(nav){
    var btns = $$('button[data-tab]', nav).filter(function(b){ return document.getElementById(b.dataset.tab); });
    if (btns.length < 2) return;
    var activeCls = btns.some(function(b){ return b.classList.contains('active'); }) ? 'active' : 'on';
    nav.setAttribute('role', 'tablist');
    if (!nav.getAttribute('aria-label')) nav.setAttribute('aria-label', C.tabsLabel || 'Sections');
    btns.forEach(function(b){
      var p = document.getElementById(b.dataset.tab);
      if (!b.id) b.id = 'tab-' + b.dataset.tab;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', p.id);
      p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id);
    });
    var sync = function(){
      btns.forEach(function(x){ var on = x.classList.contains(activeCls); x.setAttribute('aria-selected', on ? 'true' : 'false'); x.tabIndex = on ? 0 : -1; });
    };
    btns.forEach(function(x){ new MutationObserver(sync).observe(x, {attributes:true, attributeFilter:['class']}); });
    nav.addEventListener('keydown', function(e){
      var i = btns.indexOf(document.activeElement); if (i < 0) return;
      var j = null, n = btns.length;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % n;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + n) % n;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = n - 1;
      if (j !== null){ e.preventDefault(); btns[j].click(); btns[j].focus(); }
    });
    sync();
  });

  /* Toggle buttons: expose on/off state */
  (C.pressed || []).forEach(function(pair){
    $$(pair[0]).forEach(function(b){
      var s = function(){ b.setAttribute('aria-pressed', b.classList.contains(pair[1]) ? 'true' : 'false'); };
      new MutationObserver(s).observe(b, {attributes:true, attributeFilter:['class']}); s();
    });
  });

  /* Text alternatives for canvases and diagrams */
  (C.img || []).forEach(function(pair){
    $$(pair[0]).forEach(function(el, i){
      var d = (typeof pair[1] === 'function') ? pair[1](el, i) : pair[1];
      el.setAttribute('role', 'img'); el.setAttribute('aria-label', d);
    });
  });
  (C.groups || []).forEach(function(pair){
    $$(pair[0]).forEach(function(el){ el.setAttribute('role', 'group'); el.setAttribute('aria-label', pair[1]); });
  });
  (C.hidden || []).forEach(function(sel){ $$(sel).forEach(function(el){ el.setAttribute('aria-hidden', 'true'); }); });

  /* Announce result text when it changes after the student does something */
  var regions = [];
  function txt(el){ return clean(el.innerText !== undefined ? el.innerText : el.textContent); }
  (C.live || []).forEach(function(sel){ $$(sel).forEach(function(el){ regions.push({el:el, last:txt(el), dirty:false}); }); });
  var timer = null, first = 0;
  function flush(){
    first = 0;
    var parts = regions.filter(function(r){ return r.dirty && r.el.offsetParent !== null && r.last; }).map(function(r){ return r.last; });
    regions.forEach(function(r){ r.dirty = false; });
    if (parts.length) say(parts.join('. '));
  }
  function check(){
    var changed = false;
    regions.forEach(function(r){ var t = txt(r.el); if (t !== r.last){ r.last = t; r.dirty = true; changed = true; } });
    if (!changed) return;
    var now = performance.now();
    if (now - lastAct > 12000){ regions.forEach(function(r){ r.dirty = false; }); return; }
    if (!first) first = now;
    clearTimeout(timer);
    timer = setTimeout(flush, Math.max(0, Math.min(900, 4000 - (now - first))));
  }
  regions.forEach(function(r){ new MutationObserver(check).observe(r.el, {childList:true, characterData:true, subtree:true}); });
})();
