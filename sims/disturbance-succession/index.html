<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Succession &amp; Disturbance: Four Classic Papers</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2530;--muted:#5d6877;--line:#cfd6df;--accent:#1f6fbf;--soft:#eef2f6;--good:#1d7a3a;--bad:#b3261e;
--s1:#2a78d6;--s2:#d4561f;--s3:#178f64;--s4:#b07800;--s5:#c2477a;--s6:#6250d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d242d;--text:#e7ecf2;--muted:#9aa6b4;--line:#38424f;--accent:#6ab0f3;--soft:#262f3a;--good:#5fd38a;--bad:#ff8a80;
--s1:#5a9cf0;--s2:#f07a45;--s3:#2fc08b;--s4:#e0a82a;--s5:#e67aa6;--s6:#9a8cf0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif;padding:16px;line-height:1.45}
.wrap{max-width:1150px;margin:0 auto}
a{color:var(--accent)}
.back{font-size:.82rem;text-decoration:none}
h1{font-size:1.45rem;margin:4px 0 4px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:.95rem;margin:12px 0 6px}
p.sub{margin:0 0 10px;color:var(--muted);font-size:.93rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
nav.tabs button{font:inherit;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
section.panel{display:none}
section.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.layout>.card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.grid2>.card{margin-bottom:0}
button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select{font:inherit;font-size:.85rem;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;margin:9px 0 1px}
.ctrl label .val{font-weight:700;font-variant-numeric:tabular-nums}
.ctrl .hint{font-size:.75rem;color:var(--muted);margin:0 0 2px}
.ctrl h3:first-child{margin-top:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.check{display:flex;gap:6px;align-items:center;font-size:.86rem;margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 10px}
.tile{background:var(--soft);border-radius:10px;padding:8px 12px}
.tile .k{font-size:.76rem;color:var(--muted)}
.tile .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{fill:var(--muted);font-size:12px;font-family:system-ui,Arial,sans-serif}
.chart .ax{stroke:var(--line)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 3;opacity:.7}
.chart .lab{fill:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.legend span{display:flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.msg{font-size:.9rem;background:var(--soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:8px}
.msg.good{border-left-color:var(--good)} .msg.bad{border-left-color:var(--bad)}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;overflow-x:auto}
details{margin-top:8px} details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.presets button{font-size:.8rem;padding:5px 10px}
/* quiz */
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:none}
.q p{margin:0 0 6px;font-weight:600}
.q .opts{display:flex;flex-direction:column;gap:5px}
.q .opts button{text-align:left}
.q .opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.q .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.q .fb{font-size:.88rem;margin-top:6px;min-height:1em}
canvas{display:block;width:100%;height:auto;border-radius:8px;background:var(--soft);touch-action:manipulation}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.grid2{grid-template-columns:1fr} body{padding:10px}}
.ctrl label.check{justify-content:flex-start;font-size:.86rem}
.ctrl .island h3{display:flex;align-items:center;gap:6px}
.rng{display:flex;gap:8px;align-items:center}
.rng input[type=range]{flex:1;min-width:0}
.box{width:78px;flex:none;font:inherit;font-size:.82rem;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.paper{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s4);border-radius:12px;padding:12px 16px;margin:0 0 12px}
.paper .cite{font-size:.84rem;color:var(--muted);margin:6px 0 0}
.paper p{margin:6px 0}
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding:6px 0 6px 34px;border-top:1px solid var(--line);font-size:.9rem}
.steps li:first-child{border-top:none}
.steps li::before{content:counter(st);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.steps li button{margin-top:5px;font-size:.8rem;padding:4px 10px}
table.cmp{border-collapse:collapse;width:100%;font-size:.86rem}
table.cmp th,table.cmp td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{background:var(--soft)}
table.cmp td.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.traits input[type=number]{width:70px;font:inherit;font-size:.8rem;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps li::before{color:#0d1b2a}}
label.hasbox .val{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.layout>*{min-width:0}
/* paper tabs */
.pp-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.pp-sec>h2{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.pp-sec>h2 .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:.85rem;flex:none}
.pp-sec p,.pp-sec li{font-size:.93rem}
.pp-head{border-left:5px solid var(--s4)}
.pp-head h2{font-size:1.15rem;margin-bottom:4px}
.pp-head .cite{font-size:.85rem;color:var(--muted);margin:4px 0 0}
.hyp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:6px}
.hyp div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem}
.pred-opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pred-opts button{text-align:left}
.pred-opts button.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:600}
.locked{position:relative}
.locked>.lockmsg{display:block;padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.locked>.lockbody{display:none}
.locked.unlocked>.lockmsg{display:none}
.locked.unlocked>.lockbody{display:block}
.discuss li{margin:6px 0}
.datatbl{margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pp-sec>h2 .num{color:#0d1b2a}}
.pp-sec .chart svg{max-width:760px;margin:0 auto}

.modelsel button{font-size:.85rem}
.modelsel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../../">&larr; All class simulations</a>
<h1>Succession &amp; Disturbance: Four Classic Papers</h1>
<p class="sub">Each tab walks through one landmark paper on how communities change after disturbance and how disturbance shapes diversity. Read the question, see the design, make a prediction, then look at what the authors found.</p>
<nav class="tabs">
  <button class="on" data-tab="t1">Connell &amp; Slatyer 1977</button>
  <button data-tab="t2">Connell 1978</button>
  <button data-tab="t3">Sousa 1979: boulders</button>
  <button data-tab="t4">Tilman 1994</button>
</nav>
<section class="panel on" id="t1"></section>
<section class="panel" id="t2"></section>
<section class="panel" id="t3"></section>
<section class="panel" id="t4"></section>
</div>

<script>
/* ---------- shared helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const f=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS='http://www.w3.org/2000/svg';
function niceTicks(lo,hi,n=5){const span=hi-lo||1;let step=Math.pow(10,Math.floor(Math.log10(span/n)));const err=span/n/step;if(err>=7.5)step*=10;else if(err>=3.5)step*=5;else if(err>=1.5)step*=2;const out=[];for(let v=Math.ceil(lo/step-1e-9)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out}
let _clip=0;
/* chart(svg,{xmin,xmax,ymin,ymax,xlab,ylab,series:[{pts,color,width,dash,fill}],points:[{x,y,color,r,ring}],texts:[{x,y,t,color,anchor}],logx,logy}) */
function chart(svg,o){
  const W=o.w||560,H=o.h||330,m={l:o.ml||56,r:14,t:12,b:44};
  const pw=W-m.l-m.r,ph=H-m.t-m.b;
  const tx=v=>o.logx?Math.log10(v):v, ty=v=>o.logy?Math.log10(v):v;
  const x0=tx(o.xmin),x1=tx(o.xmax),y0=ty(o.ymin),y1=ty(o.ymax);
  const X=v=>m.l+(tx(v)-x0)/(x1-x0)*pw, Y=v=>m.t+ph-(ty(v)-y0)/(y1-y0)*ph;
  const id='c'+(++_clip);
  let s=`<defs><clipPath id="${id}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  const xt=o.logx?logTicks(o.xmin,o.xmax):niceTicks(o.xmin,o.xmax,o.xticks||6), yt=o.logy?logTicks(o.ymin,o.ymax):niceTicks(o.ymin,o.ymax,5);
  xt.forEach(v=>{const x=X(v);if(x<m.l-1||x>m.l+pw+1)return;s+=`<line class="grid" x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t+ph}"/><text x="${x}" y="${m.t+ph+16}" text-anchor="middle">${fmtTick(v)}</text>`});
  yt.forEach(v=>{const y=Y(v);if(y<m.t-1||y>m.t+ph+1)return;s+=`<line class="grid" x1="${m.l}" x2="${m.l+pw}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${fmtTick(v)}</text>`});
  s+=`<rect class="ax" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none"/>`;
  s+=`<text class="lab" x="${m.l+pw/2}" y="${H-6}" text-anchor="middle">${o.xlab||''}</text>`;
  s+=`<text class="lab" transform="translate(14 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${o.ylab||''}</text>`;
  s+=`<g clip-path="url(#${id})">`;
  (o.series||[]).forEach(se=>{if(!se.pts||!se.pts.length)return;
    const d=se.pts.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])).map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(Math.max(o.logy?1e-9:-1e9,Math.min(p[1],o.ymax*50+1e6))).toFixed(1)).join('');
    if(se.fill)s+=`<path d="${d}" fill="${se.color}" fill-opacity="${se.fill}" stroke="none"/>`;
    else s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width||2.2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round" stroke-linecap="round" ${se.opacity?`opacity="${se.opacity}"`:''}/>`});
  (o.points||[]).forEach(p=>{if(!Number.isFinite(p.x)||!Number.isFinite(p.y))return;s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||5}" fill="${p.ring?'var(--card)':p.color}" stroke="${p.color}" stroke-width="${p.ring?2.5:1.5}"/>`});
  s+='</g>';
  (o.texts||[]).forEach(t=>{s+=`<text x="${X(t.x)+(t.dx||0)}" y="${Y(t.y)+(t.dy||0)}" text-anchor="${t.anchor||'start'}" style="fill:${t.color||'var(--text)'};font-weight:600">${t.t}</text>`});
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s;
  const inv=(cx,cy)=>{const r=svg.getBoundingClientRect(),sx=(cx-r.left)/r.width*W,sy=(cy-r.top)/r.height*H;
    let vx=x0+(sx-m.l)/pw*(x1-x0),vy=y0+(m.t+ph-sy)/ph*(y1-y0);if(o.logx)vx=10**vx;if(o.logy)vy=10**vy;return[vx,vy,sx>=m.l&&sx<=m.l+pw&&sy>=m.t&&sy<=m.t+ph]};
  return{X,Y,inv};
}
function logTicks(lo,hi){const out=[];for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++)out.push(10**e);return out}
function fmtTick(v){const a=Math.abs(v);if(a>=10000)return(v/1000)+'k';if(a>=1||a===0)return+v.toFixed(2)+'';return+v.toPrecision(2)+''}
function legend(el,items){el.innerHTML=items.map(([c,t,dash])=>`<span><i class="sw" style="background:${dash?'transparent':c};${dash?`border:2px dashed ${c}`:''}"></i>${t}</span>`).join('')}
/* sliders: <input type=range id=x data-d=decimals> with <span id=xV> */
function val(id){const b=document.getElementById(id+'Box');return b&&b.value!==''?+b.value:+document.getElementById(id).value}
function showVals(){$$('input[type=range]').forEach(r=>{const b=document.getElementById(r.id+'Box'),v=val(r.id);if(b&&document.activeElement!==b&&+b.value!==v)b.value=v;const o=$('#'+r.id+'V');if(o)o.textContent=(r.dataset.pre||'')+v.toFixed(+(r.dataset.d||0))+(r.dataset.suf||'')})}
/* typed-value boxes beside every slider (skip with data-nobox) */
function addBoxes(root=document){$$('input[type=range]:not([data-nobox])',root).forEach(r=>{if(document.getElementById(r.id+'Box'))return;
  const w=document.createElement('div');w.className='rng';r.parentNode.insertBefore(w,r);w.appendChild(r);
  const b=document.createElement('input');b.type='number';b.className='box';b.id=r.id+'Box';b.step='any';b.value=r.value;
  const lab=r.labels&&r.labels[0];if(lab)lab.classList.add('hasbox');let nm=lab?lab.cloneNode(true):null;if(nm)$$('.val',nm).forEach(x=>x.remove());
  b.setAttribute('aria-label',(nm?nm.textContent.replace(/\s+/g,' ').trim():r.id)+', type an exact value');b.title='Type an exact value';w.appendChild(b);
  b.addEventListener('change',()=>{let v=+b.value;if(!Number.isFinite(v)){b.value=r.value;return}
    const lo=b.dataset.min!==undefined?+b.dataset.min:+r.min,hi=b.dataset.max!==undefined?+b.dataset.max:+r.max;v=Math.min(hi,Math.max(lo,v));b.value=v;
    r._fromBox=true;r.value=v;r.dispatchEvent(new Event('input',{bubbles:true}));r._fromBox=false})})}
document.addEventListener('input',e=>{const r=e.target;if(r.type!=='range'||r._fromBox)return;const b=document.getElementById(r.id+'Box');if(b)b.value=r.value},true);
function setSliders(obj){Object.entries(obj).forEach(([k,v])=>{const e=$('#'+k);if(!e)return;if(e.type==='checkbox')e.checked=!!v;else{e.value=v;const b=document.getElementById(k+'Box');if(b)b.value=v}});showVals()}
/* tabs */
function initTabs(RENDER){let cur=$('nav.tabs button.on').dataset.tab;
  $$('nav.tabs button').forEach(b=>b.onclick=()=>{$$('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('section.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.tab));cur=b.dataset.tab;if(RENDER[cur])RENDER[cur]();try{history.replaceState(null,'','#'+cur)}catch(e){}});
  const h=location.hash.slice(1);const b=h&&$(`nav.tabs button[data-tab="${h}"]`);if(b)b.click();
  return()=>cur}
/* quiz */
function quiz(el,QS){el.innerHTML=QS.map((q,i)=>`<div class="q" data-i="${i}"><p>${i+1}. ${q.q}</p><div class="opts">${q.opts.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div><div class="fb" aria-live="polite"></div></div>`).join('')+'<p class="small muted score"></p>';
  const got={};
  $$('.q',el).forEach(d=>{const q=QS[+d.dataset.i];$$('.opts button',d).forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q.a;
    $$('.opts button',d).forEach(x=>x.classList.remove('right','wrong'));b.classList.add(ok?'right':'wrong');
    $('.fb',d).innerHTML=(ok?'<b class="ok" style="color:var(--good)">Correct.</b> ':'<b style="color:var(--bad)">Not quite.</b> ')+(ok?q.why:(q.hint||'Try again, or look back at the results.'));
    if(!(d.dataset.i in got))got[d.dataset.i]=ok;$('.score',el).textContent=`First-try score: ${Object.values(got).filter(Boolean).length} of ${Object.keys(got).length} answered (${QS.length} total).`})})}
/* bar chart: bars(svg,{cats:[...],series:[{name,color,vals:[...]}],ymax,ylab,xlab,w,h,fmt}) */
function bars(svg,o){
  const W=o.w||560,H=o.h||330,m={l:o.ml||56,r:14,t:16,b:o.mb||52},pw=W-m.l-m.r,ph=H-m.t-m.b,n=o.cats.length,k=o.series.length;
  const ymax=o.ymax||Math.max(...o.series.flatMap(s=>s.vals))*1.15||1,Y=v=>m.t+ph-v/ymax*ph,gw=pw/n,bw=Math.min(60,gw*0.8/k);
  let s='';niceTicks(0,ymax,5).forEach(v=>{const y=Y(v);s+=`<line class="grid" x1="${m.l}" x2="${m.l+pw}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${fmtTick(v)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${m.l+pw}" y1="${m.t+ph}" y2="${m.t+ph}"/>`;
  o.cats.forEach((c,i)=>{const cx=m.l+gw*(i+0.5);
    o.series.forEach((se,j)=>{const v=se.vals[i];if(v==null||!Number.isFinite(v))return;const x=cx-k*bw/2+j*bw,y=Y(v);
      s+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${m.t+ph-y}" fill="${se.color}" rx="2" ${se.hatch?'fill-opacity=".45" stroke="'+se.color+'" stroke-width="1.5" stroke-dasharray="4 2"':''}/>`;
      s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:var(--text);font-size:11px">${o.fmt?o.fmt(v):fmtTick(+v.toFixed(2))}</text>`});
    String(c).split('\n').forEach((line,li)=>{s+=`<text x="${cx}" y="${m.t+ph+16+li*13}" text-anchor="middle">${line}</text>`})});
  s+=`<text class="lab" transform="translate(14 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${o.ylab||''}</text>`;
  if(o.xlab)s+=`<text class="lab" x="${m.l+pw/2}" y="${H-6}" text-anchor="middle">${o.xlab}</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=s}

/* ---------- paper-tab engine ----------
 P = {id, cite, doi, why, question, hyps:[[title,text]], design(html), predict:{q,opts:[text],note?:[fb per option]},
      results(html), afterResults(fn), found(html), interpret:[quiz items], model(html)?, afterModel(fn)?, discuss:[...] } */
function paperTab(el,P){
  const sec=(n,t,body,cls='')=>`<div class="pp-sec ${cls}"><h2>${n?`<span class="num">${n}</span>`:''}${t}</h2>${body}</div>`;
  let n=1,h='';
  h+=`<div class="pp-sec pp-head"><h2>${P.title}</h2><p style="margin:0">${P.why}</p><p class="cite">${P.cite}${P.doi?` <a href="https://doi.org/${P.doi}" target="_blank" rel="noopener">doi:${P.doi}</a>`:''}${P.url?` <a href="${P.url}" target="_blank" rel="noopener">Read it</a>`:''}</p></div>`;
  h+=sec(n++,'The question',`<p>${P.question}</p>${P.hyps?`<div class="hyp">${P.hyps.map(x=>`<div><b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div>`:''}`);
  h+=sec(n++,'What they did',P.design);
  h+=sec(n++,'Your prediction',`<p>${P.predict.q}</p><div class="pred-opts" id="${P.id}-pred">${P.predict.opts.map((o,i)=>`<button data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div><div class="msg small" id="${P.id}-predfb" style="display:none" aria-live="polite"></div>`);
  h+=sec(n++,'What they found',`<div class="locked" id="${P.id}-lock"><div class="lockmsg">Make a prediction above to unlock the results.</div><div class="lockbody">${P.results}<div class="msg" style="margin-top:10px">${P.found}</div></div></div>`);
  h+=sec(n++,'Interpret the results',`<div id="${P.id}-quiz"></div>`);
  if(P.model)h+=sec(n++,P.modelTitle||'Try the model',P.model);
  h+=sec(n++,'Discuss',`<ol class="discuss">${P.discuss.map(d=>`<li>${d}</li>`).join('')}</ol>`);
  el.innerHTML=h;
  quiz($(`#${P.id}-quiz`),P.interpret);
  let shown=false;
  $$(`#${P.id}-pred button`).forEach(b=>b.onclick=()=>{
    $$(`#${P.id}-pred button`).forEach(x=>{x.classList.toggle('picked',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});
    const fb=$(`#${P.id}-predfb`);fb.style.display='block';fb.innerHTML=`<b>Prediction saved.</b> ${P.predict.note?P.predict.note[+b.dataset.i]:''} Scroll down to compare with what the authors found.`;
    const L=$(`#${P.id}-lock`);L.classList.add('unlocked');if(!shown){shown=true;if(P.afterResults)P.afterResults()}});
  if(P.afterModel)P.afterModel();
  return{redraw:()=>{if(shown&&P.afterResults)P.afterResults();if(P.afterModel)P.afterModel()}};
}

(function(){
const tabs={};

/* =================== 1. CONNELL & SLATYER =================== */
const CSM={fac:'Facilitation',tol:'Tolerance',inh:'Inhibition'};
tabs.t1=paperTab($('#t1'),{id:'cs',title:'Mechanisms of succession in natural communities',
  why:'Replaced the old idea of succession as one fixed path to a "climax" with three testable models of how early species affect later ones.',
  cite:'Connell, J. H., &amp; R. O. Slatyer (1977). Mechanisms of succession in natural communities and their role in community stability and organization. <i>The American Naturalist</i> 111: 1119–1144.',doi:'10.1086/283241',
  question:'After a disturbance opens up space, a sequence of species moves in, each replaced by the next. The classic view held that early species prepare the site for later ones. <b>Is that the only way succession works? How do early species actually affect the species that replace them?</b>',
  hyps:[['Facilitation','Early species change the site (adding soil, nitrogen, or shade) so that later species can only establish after them.'],['Tolerance','Early species neither help nor hinder later ones; later species can grow at lower resource levels and eventually take over anyway.'],['Inhibition','Early species hold the space and keep later species out; later species take over only when early ones die or are damaged.']],
  design:`<p>This was a <b>synthesis paper</b>. Connell and Slatyer reviewed studies of succession in forests, old fields, grasslands, and marine communities, and organized the possible mechanisms into the three models above (their Figure 1). The key point was that the models make <b>different predictions for experiments</b>: if you remove the early species, what happens to the later ones?</p>`,
  predict:{q:'Suppose early colonists are removed from a cleared site. Under the INHIBITION model, what happens to later species?',opts:['They fail to establish','They establish at the same rate as usual','They establish faster than usual','They disappear from the region']},
  results:`<p>Choose a model to see its prediction for a removal experiment (conceptual curves, not data).</p><div class="row modelsel" id="csSel"><button data-m="fac">Facilitation</button><button data-m="tol">Tolerance</button><button data-m="inh" class="on">Inhibition</button></div>
    <div class="chart"><svg id="csR"></svg></div><div class="legend" id="csLeg"></div>
    <table class="cmp" style="margin-top:8px"><tr><th>Model</th><th>Remove early species → later species…</th></tr><tr><td>Facilitation</td><td>fail or establish more slowly</td></tr><tr><td>Tolerance</td><td>establish about the same</td></tr><tr><td>Inhibition</td><td>establish <b>faster</b></td></tr></table>`,
  found:'Connell and Slatyer argued that the classic facilitation model fits some cases, especially some primary successions on bare ground, but that much of the evidence fit the tolerance and inhibition models better. Under inhibition, the sequence of species reflects their <b>life histories</b> (who arrives first, who lives longest) rather than one species preparing the way for the next. They urged ecologists to test the models with removal experiments, and many later studies did, including Sousa\'s boulder experiments (tab 3), which supported inhibition.',
  afterResults:()=>{let m='inh';const go=()=>{const xs=[];for(let i=0;i<=100;i++)xs.push(i*0.2);
      const L=(t,on)=>100/(1+Math.exp(-(t-on)*1.2));
      const pres={fac:t=>L(t,8),tol:t=>L(t,8),inh:t=>L(t,12)}[m],rem={fac:t=>Math.min(8,L(t,30)),tol:t=>L(t,8),inh:t=>L(t,4)}[m];
      chart($('#csR'),{xmin:0,xmax:20,ymin:0,ymax:105,w:620,h:300,xlab:'Time since disturbance →',ylab:'Cover of later species (%)',xticks:2,series:[{pts:xs.map(t=>[t,pres(t)]),color:'var(--s1)',width:2.6},{pts:xs.map(t=>[t,rem(t)]),color:'var(--s2)',width:2.6,dash:'6 4'}]});
      legend($('#csLeg'),[['var(--s1)','Early species left in place'],['var(--s2)','Early species removed',1]]);
      $('#csR').setAttribute('aria-label',`Conceptual curves for the ${CSM[m]} model: ${m==='fac'?'later species barely establish when early species are removed':m==='tol'?'later species establish at the same time either way':'later species establish sooner when early species are removed'}.`);
      $$('#csSel button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))};
    $$('#csSel button').forEach(b=>b.onclick=()=>{m=b.dataset.m;go()});go()},
  interpret:[
    {q:'Sousa removed the green alga Ulva from cleared boulders, and red algae then established faster. Which model does this support?',opts:['Facilitation','Tolerance','Inhibition','None'],a:2,why:'Removing the early species sped up the later ones, so the early species were inhibiting them.'},
    {q:'Why can\'t you tell the three models apart just by watching the order in which species appear?',opts:['Because all three can produce the same sequence of species; only experiments reveal the mechanism','Because species appear randomly','Because succession never happens','Because observation is illegal'],a:0,why:'Early species are replaced by later ones under every model. The mechanism only shows up when you manipulate the early species.'},
    {q:'Under which model does succession depend most on which species happen to arrive first?',opts:['Facilitation','Tolerance','Inhibition','All equally'],a:2,why:'Under inhibition, whoever holds the space first resists invasion, so arrival order matters a lot.'}],
  discuss:['Give an example from California (for example, after a wildfire or on a new sandbar) where you think one model fits best. What experiment would test it?','Could different mechanisms operate at different stages of the same succession?','Why did this paper matter for restoration ecology?']});

/* =================== 2. CONNELL 1978 =================== */
tabs.t2=paperTab($('#t2'),{id:'id',title:'Diversity in tropical rain forests and coral reefs',
  why:'Introduced the intermediate disturbance hypothesis, one of the most cited ideas in ecology.',
  cite:'Connell, J. H. (1978). Diversity in tropical rain forests and coral reefs. <i>Science</i> 199: 1302–1310.',doi:'10.1126/science.199.4335.1302',
  question:'Tropical rain forests and coral reefs hold enormous numbers of species living side by side. If competition leads to exclusion, <b>how do so many species coexist?</b> Is the high diversity a stable equilibrium, or something that persists only because the system never settles down?',
  hyps:[['Equilibrium','Species are finely specialized (niche differences), so many can coexist stably once the community settles.'],['Nonequilibrium','Disturbances (storms, treefalls, predators) keep knocking the community back before the best competitors can exclude the rest.']],
  design:`<p>Connell compared six hypotheses for high diversity, grouped into equilibrium and nonequilibrium explanations, and weighed them against evidence. Much of it came from his own long-term studies: permanent plots of rain forest trees in Queensland, Australia, and coral reef plots at Heron Island on the Great Barrier Reef, which he began photographing in 1962.</p>
    <p>He defined disturbance by its <b>frequency</b>, its <b>intensity</b>, and the <b>time since</b> the last one.</p>`,
  predict:{q:'According to the intermediate disturbance hypothesis, where should diversity be highest?',opts:['Where disturbance never happens','Where disturbance is very frequent or very intense','Where disturbance is intermediate in frequency or intensity, or some time after a disturbance','Diversity does not depend on disturbance']},
  results:`<div class="chart"><svg id="idR"></svg></div><p class="small muted">The shape of Connell's conceptual figure (not data).</p>`,
  found:'Connell concluded that the high diversity of trees in rain forests and of corals on reefs is usually a <b>nonequilibrium</b> state. Left undisturbed, these communities would drift toward fewer species as the best competitors took over. Disturbances often enough, but not too often, keep that from happening. With too little disturbance, a few dominants win; with too much, only fast colonizers survive. Diversity is highest in between.',
  afterResults:()=>{const xs=[];for(let i=0;i<=100;i++)xs.push(i);
    chart($('#idR'),{xmin:0,xmax:100,ymin:0,ymax:100,w:620,h:320,xlab:'Disturbance: frequency or intensity (low → high), or time since disturbance (long → short)',ylab:'Species diversity',xticks:2,
      series:[{pts:xs.map(x=>[x,90*Math.exp(-(((x-50)/26)**2))+5]),color:'var(--s3)',width:3}],texts:[{x:6,y:20,t:'competitive exclusion',color:'var(--muted)'},{x:94,y:20,t:'only colonizers survive',color:'var(--muted)',anchor:'end'},{x:50,y:97,t:'mix of early and late species',color:'var(--muted)',anchor:'middle'}]});
    $('#idR').setAttribute('aria-label','Conceptual hump-shaped curve: diversity is low at low disturbance, highest at intermediate disturbance, and low at high disturbance.')},
  interpret:[
    {q:'Why is diversity low when disturbance is very rare?',opts:['Nothing can colonize','The best competitors have time to exclude other species','Disturbance kills everything','Predators eat all the species'],a:1,why:'Without disturbance, the community approaches equilibrium, where the strongest competitors dominate.'},
    {q:'Why is diversity low when disturbance is very frequent or intense?',opts:['Only species that colonize quickly and grow fast can persist','Competition is too strong','There are too many species','Disturbance creates new species'],a:0,why:'Frequent disturbance resets the community before slower-growing, competitively superior species can establish.'},
    {q:'What kind of evidence would best test this idea?',opts:['A single photo of a reef','Comparing sites or treatments that differ in disturbance and measuring diversity, ideally over long periods','Counting species in one place once','Asking divers'],a:1,why:'You need variation in disturbance and repeated measurements, like Sousa\'s boulders (tab 3) or Connell\'s long-term reef plots.'}],
  discuss:['Connell\'s reef plots at Heron Island were followed for decades. Why are long-term plots so valuable for testing ideas about disturbance?','Later studies found the hump shape in some systems but not others. What might cause the pattern to fail?','How could managers use this idea, for example with prescribed fire in Sierra foothill grasslands and woodlands?']});

/* =================== 3. SOUSA =================== */
const CENS=['Nov 1975','May 1976','Oct 1976','May 1977'],SP=[[1.7,1.9,1.9,1.4],[3.7,4.3,3.4,3.6],[2.5,3.5,2.3,3.2]],BARE=[[78.0,66.5,67.7,49.9],[26.5,35.9,32.2,34.2],[11.4,4.7,14.5,6.1]];
const STAB=[[2,1.13],[4,1.8],[7,3.75],[11,4.08],[13,5.08],[16,5.29],[19,4.9]];
tabs.t3=paperTab($('#t3'),{id:'so',title:'Disturbance in marine intertidal boulder fields: the nonequilibrium maintenance of species diversity',
  why:'One of the first field tests of the intermediate disturbance hypothesis, using a natural gradient of disturbance and a clever experiment.',
  cite:'Sousa, W. P. (1979). Disturbance in marine intertidal boulder fields: the nonequilibrium maintenance of species diversity. <i>Ecology</i> 60: 1225–1239.',doi:'10.2307/1936969',
  question:'In a boulder field at Ellwood Beach, California, winter waves roll boulders over and scrape their tops clean. Small boulders roll often and large ones rarely. <b>Does the frequency of disturbance control how many species live on a boulder?</b>',
  hyps:[['Diversity rises with stability','The least-disturbed (large) boulders have the most species.'],['Intermediate disturbance','Boulders disturbed at an intermediate rate have the most species.']],
  design:`<p>Sousa measured the force needed to move each boulder and grouped boulders into three classes: easily moved (under 49 newtons), intermediate (50–294 N), and hard to move (over 294 N). He marked boulders and recorded how often each class rolled over, and censused the algae and barnacles on boulder tops four times between November 1975 and May 1977.</p>
    <p>To show that disturbance, not boulder size itself, caused the differences, he <b>bolted small rocks to the bottom</b> so they could not roll, and followed them for over a year.</p>`,
  predict:{q:'Which boulder class do you expect to have the most species?',opts:['Small (rolled most often)','Intermediate','Large (rarely rolled)','All the same']},
  results:`<div class="tiles"><div class="tile"><div class="k">Small: chance of rolling per month</div><div class="v">0.42</div></div><div class="tile"><div class="k">Intermediate</div><div class="v">0.09</div></div><div class="tile"><div class="k">Large</div><div class="v">0.001</div></div></div>
    <div class="row"><b class="small">Show:</b><button class="primary" id="soA">Species per boulder</button><button id="soB">% bare space</button></div>
    <div class="chart"><svg id="soR"></svg></div><div class="legend" id="soLeg"></div>
    <h3>Bolted-down small rocks</h3><div class="chart"><svg id="soS"></svg></div>
    <p class="small muted">Monthly rolling chances: Table 1. Species per boulder: Table 5. Bare space: Table 2. Bolted-rock means calculated from the percentages in Table 8.</p>`,
  found:'In every census, <b>intermediate boulders had the most species</b>. Small boulders, rolled over almost every other month, held mostly bare rock with the early colonists <i>Ulva</i> and barnacles. Large boulders, almost never rolled, were dominated by the late-successional red alga <i>Gigartina canaliculata</i>, which crowded out other species. Bolted small rocks gained species until they matched intermediate boulders, showing that the frequency of disturbance, not boulder size, controlled diversity. Diversity was maintained by disturbance in a <b>nonequilibrium</b> patchwork.',
  afterResults:()=>{let mode='a';const cols=['var(--s4)','var(--s1)','var(--s5)'];const go=()=>{const d=mode==='a'?SP:BARE;
      bars($('#soR'),{cats:CENS,series:['Small','Intermediate','Large'].map((n,i)=>({name:n,color:cols[i],vals:d[i]})),ymax:mode==='a'?5:90,ylab:mode==='a'?'Mean species per boulder':'Mean % bare space',w:720,h:320,fmt:v=>mode==='a'?v.toFixed(1):v.toFixed(0)+'%'});
      legend($('#soLeg'),[['var(--s4)','Small (rolls often)'],['var(--s1)','Intermediate'],['var(--s5)','Large (rarely rolls)']]);
      $('#soR').setAttribute('aria-label',(mode==='a'?'Mean species per boulder':'Mean percent bare space')+' by census. '+['Small','Intermediate','Large'].map((n,i)=>`${n}: ${d[i].join(', ')}`).join('; ')+'.');
      $('#soA').classList.toggle('primary',mode==='a');$('#soB').classList.toggle('primary',mode==='b')};
    $('#soA').onclick=()=>{mode='a';go()};$('#soB').onclick=()=>{mode='b';go()};go();
    chart($('#soS'),{xmin:0,xmax:20,ymin:0,ymax:6,w:620,h:280,xlab:'Months after the rocks were cleared',ylab:'Mean species per rock',series:[{pts:STAB,color:'var(--s3)',width:2.4},{pts:[[0,3.75],[20,3.75]],color:'var(--s1)',dash:'5 4',width:1.4}],points:STAB.map(([t,v])=>({x:t,y:v,color:'var(--s3)',r:5})),texts:[{x:19.5,y:3.75,t:'intermediate boulders (avg)',color:'var(--s1)',anchor:'end',dy:-6}]});
    $('#soS').setAttribute('aria-label','Mean species per bolted rock rises from about 1 at 2 months to about 5 at 13 to 19 months, above the average for intermediate boulders of 3.75.')},
  interpret:[
    {q:'Why did large boulders have fewer species than intermediate ones?',opts:['They were too cold','Without disturbance, Gigartina canaliculata took over and excluded other species','Waves scraped them every month','They had no algae'],a:1,why:'Large boulders rarely rolled, so succession ran to the late-successional dominant.'},
    {q:'What was the purpose of bolting small rocks down?',opts:['To stop them from washing away','To separate the effect of disturbance from the effect of rock size','To kill the algae','To measure wave force'],a:1,why:'Small and large boulders differ in more than disturbance (surface area, for example). Removing disturbance while keeping size the same isolates its effect.'},
    {q:'Why is this called a "nonequilibrium" explanation of diversity?',opts:['Because the boulders are not level','Because diversity is maintained by repeated disturbance that keeps the community from reaching competitive equilibrium','Because there are no species','Because the data were uneven'],a:1,why:'At equilibrium one species would dominate; disturbance keeps boulders at a mix of successional stages.'}],
  discuss:['Sousa used boulder size as a stand-in for disturbance frequency. What else differs between small and large boulders that could matter?','Large boulders had more species in spring than in fall. Using what you know about winter storms, why?','How would you design a similar study in a California grassland or chaparral using fire instead of waves?']});

/* =================== 4. TILMAN 1994 =================== */
tabs.t4=paperTab($('#t4'),{id:'ti',title:'Competition and biodiversity in spatially structured habitats',
  why:'Showed mathematically that a trade-off between competing and colonizing can let many species coexist on a single limiting resource.',
  cite:'Tilman, D. (1994). Competition and biodiversity in spatially structured habitats. <i>Ecology</i> 75: 2–16.',
  question:'Plants in a prairie compete for the same few resources, yet dozens of species coexist. <b>Can many species coexist on one limiting resource if habitat is made of separate sites that are colonized and vacated?</b>',
  hyps:[['No','The best competitor should take every site.'],['Yes, with a trade-off','If better competitors are worse at colonizing new sites, poorer competitors can persist by reaching open sites first.']],
  design:`<p>Tilman built a mathematical model of a landscape made of many small sites, each holding one individual. Species colonize empty sites at rate c and die at rate m. A better competitor can take over a site held by a weaker one. He solved for the share of sites each species occupies at equilibrium:</p>
    <div class="formula">p₁* = 1 − m/c₁ &nbsp;&nbsp;(best competitor)<br>pᵢ* = 1 − m/cᵢ − Σ<sub>j&lt;i</sub> pⱼ*(1 + cⱼ/cᵢ) &nbsp;&nbsp;(species i, ranked by competitive ability)</div>
    `,
  predict:{q:'In this model, how many species can coexist on a single resource?',opts:['Only one, the best competitor','At most two','Many, as long as each weaker competitor colonizes sufficiently better','None']},
  results:`<p class="small">Use the model below to see the result: with a strong enough competition–colonization trade-off, many species coexist.</p>`,
  found:'In Tilman\'s model, an unlimited number of species could in principle coexist on a single resource, as long as each weaker competitor was a sufficiently better colonizer than the species above it. There is a <b>limiting similarity</b>: species too similar in colonization rate are excluded. The model shows why spatial structure and dispersal matter for biodiversity.',
  interpret:[
    {q:'In this model, why can a weak competitor persist?',opts:['It wins every contest','It colonizes empty sites faster than better competitors can take them','It never dies','It eats the better competitor'],a:1,why:'Fugitive species persist by reaching open sites first, before superior competitors arrive.'},
    {q:'Why does the best competitor not fill every site?',opts:['It dies (m > 0) and colonizes slowly, so some sites are always empty for a while','It is excluded by weaker species','Sites are too large','It has no seeds'],a:0,why:'p₁* = 1 − m/c₁: with mortality and limited colonization, the best competitor cannot occupy everything.'},
    {q:'How does this connect to Sousa\'s boulders and Connell\'s intermediate disturbance idea?',opts:['It doesn\'t','Disturbance creates open sites; species that colonize well but compete poorly depend on those openings','It shows disturbance is unnecessary','It only applies to animals'],a:1,why:'Both involve a trade-off between colonizing new space and holding space against competitors.'}],
  modelTitle:'Tilman\'s competition–colonization model',
  model:`<div class="layout"><div class="ctrl">
      <label for="tn">Number of species <span class="val" id="tnV"></span></label><input type="range" id="tn" min="2" max="12" step="1" value="6">
      <label for="tm">Mortality m <span class="val" id="tmV"></span></label><input type="range" id="tm" min="0.01" max="0.5" step="0.01" value="0.1" data-d="2">
      <label for="tc">Colonization rate of best competitor c₁ <span class="val" id="tcV"></span></label><input type="range" id="tc" min="0.05" max="2" step="0.01" value="0.2" data-d="2">
      <label for="tr">Each weaker species colonizes ×<span class="val" id="trV"></span> more</label><input type="range" id="tr" min="1" max="4" step="0.05" value="1.8" data-d="2">
    </div><div><div class="tiles"><div class="tile"><div class="k">Species that persist</div><div class="v" id="tS"></div></div><div class="tile"><div class="k">Sites left empty</div><div class="v" id="tE"></div></div></div>
      <div class="chart"><svg id="tM"></svg></div><div class="msg small" id="tMsg"></div></div></div>`,
  afterModel:()=>{if(!$('#tnBox'))addBoxes($('#t4'));const go=()=>{showVals();const n=Math.round(val('tn')),m=val('tm'),c1=val('tc'),r=val('tr');
      const c=[];for(let i=0;i<n;i++)c.push(c1*r**i);
      const q=[];for(let i=0;i<n;i++){let v=1-m/c[i];for(let j=0;j<i;j++)v-=q[j]*(1+c[j]/c[i]);q.push(Math.max(0,v))}
      bars($('#tM'),{cats:q.map((v,i)=>`Sp ${i+1}\nc=${c[i]<10?c[i].toFixed(2):c[i].toFixed(0)}`),series:[{color:'var(--s3)',vals:q.map(v=>v*100)}],ymax:100,ylab:'% of sites occupied',w:640,h:300,mb:58,fmt:v=>v.toFixed(0)});
      const S=q.filter(v=>v>1e-4).length,E=Math.max(0,1-q.reduce((a,b)=>a+b,0));
      $('#tS').textContent=`${S} of ${n}`;$('#tE').textContent=f(E*100,0)+'%';
      $('#tM').setAttribute('aria-label','Share of sites occupied by each species, ranked from best competitor: '+q.map((v,i)=>`species ${i+1} ${f(v*100,0)}%`).join(', ')+'.');
      $('#tMsg').innerHTML=S===n?'All species persist: each weaker competitor colonizes enough faster to escape the ones above it.':`${n-S} species ${n-S===1?'is':'are'} excluded. Try a larger colonization advantage (×) or lower mortality. Species 1 is the best competitor.`};
    $$('#t4 .ctrl input').forEach(i=>i.oninput=go);go()},
  discuss:['Real plants trade off seed number against seed size or root investment. Name a pair of California plants that might fit this trade-off.','In this model, which species would you expect to disappear first if half the sites were destroyed? Why might that be surprising?','How could you test the competition–colonization trade-off in a field experiment?']});

initTabs({t1:()=>tabs.t1.redraw(),t2:()=>tabs.t2.redraw(),t3:()=>tabs.t3.redraw(),t4:()=>tabs.t4.redraw()});
})();
</script>

<script>
(function(){

  function matchCfg(map, el, dflt){

  /* Extra page CSS (contrast fixes, focus styles for custom widgets) */
  if (C.css){ var st = document.createElement('style'); st.textContent = C.css; document.head.appendChild(st); }

  /* Main landmark */
  if (!document.querySelector('main,[role="main"]')){
    var m = document.querySelector(C.main || '.wrap');
    if (m) m.setAttribute('role', 'main');
  }

  /* Screen-reader announcer (polite). Only speaks after the user has interacted. */
  var ann = document.createElement('div');
  ann.className = 'sr-only'; ann.setAttribute('aria-live', 'polite'); ann.setAttribute('aria-atomic', 'true');
  document.body.appendChild(ann);
  var lastAct = -1e9;
  ['input', 'change', 'click', 'keydown'].forEach(function(e){
    document.addEventListener(e, function(){ lastAct = performance.now(); }, true);
  });
  function say(t){ ann.textContent = ''; setTimeout(function(){ ann.textContent = t; }, 50); }
  window.A11Y_say = say;

  /* Accessible names and spoken values for sliders, dropdowns and text fields */
  function labelFor(el){
    if (el.labels && el.labels.length) return el.labels[0];
    var p = el.previousElementSibling;
    while (p){ if (p.tagName === 'LABEL') return p; p = p.previousElementSibling; }
    return null;
  }
  $$('input[type="range"],select,input[type="number"],input[type="text"],input[type="search"],textarea').forEach(function(el){
    var lab = labelFor(el);
    var vals = lab ? $$('[id],.val', lab).filter(function(x){ return x !== el && !x.contains(el) && !el.contains(x) && x.tagName !== 'INPUT' && x.tagName !== 'SELECT'; }) : [];
    var name = null;
    if (lab){
      var cl = lab.cloneNode(true);
      $$('[id],.val,input,select,textarea', cl).forEach(function(x){ x.remove(); });
      var t = clean(cl.textContent);
      var associated = el.labels && el.labels.length;
      if (t && (vals.length || !associated)) name = t;
    }
    if (!name && !lab && !el.getAttribute('aria-label') && el.placeholder) name = clean(el.placeholder.replace(/\(.*?\)|…|\.\.\./g, ''));
    name = matchCfg(C.names, el, name);
    if (name) el.setAttribute('aria-label', name);

    if (el.type === 'range'){
      var unit = matchCfg(C.units, el, '');
      var upd = function(){
        var t = vals.map(function(v){ return clean(v.textContent); }).filter(Boolean).join(' ');
        if (!t) t = el.value;
        if (unit && t.indexOf(unit.trim()) < 0) t += ' ' + unit;
        if (t && t !== el.value) el.setAttribute('aria-valuetext', t); else el.removeAttribute('aria-valuetext');
      };
      vals.forEach(function(v){ new MutationObserver(upd).observe(v, {childList:true, characterData:true, subtree:true}); });
      el.addEventListener('input', function(){ setTimeout(upd, 0); });
      upd();
    }
  });

  /* Tabs: proper tab roles, selected state, and arrow-key navigation */
  $$('nav').forEach(function(nav){
    var btns = $$('button[data-tab]', nav).filter(function(b){ return document.getElementById(b.dataset.tab); });
    if (btns.length < 2) return;
    var activeCls = btns.some(function(b){ return b.classList.contains('active'); }) ? 'active' : 'on';
    nav.setAttribute('role', 'tablist');
    if (!nav.getAttribute('aria-label')) nav.setAttribute('aria-label', C.tabsLabel || 'Sections');
    btns.forEach(function(b){
      var p = document.getElementById(b.dataset.tab);
      if (!b.id) b.id = 'tab-' + b.dataset.tab;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', p.id);
      p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id);
    });
    var sync = function(){
      btns.forEach(function(x){ var on = x.classList.contains(activeCls); x.setAttribute('aria-selected', on ? 'true' : 'false'); x.tabIndex = on ? 0 : -1; });
    };
    btns.forEach(function(x){ new MutationObserver(sync).observe(x, {attributes:true, attributeFilter:['class']}); });
    nav.addEventListener('keydown', function(e){
      var i = btns.indexOf(document.activeElement); if (i < 0) return;
      var j = null, n = btns.length;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % n;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + n) % n;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = n - 1;
      if (j !== null){ e.preventDefault(); btns[j].click(); btns[j].focus(); }
    });
    sync();
  });

  /* Toggle buttons: expose on/off state */
  (C.pressed || []).forEach(function(pair){
    $$(pair[0]).forEach(function(b){
      var s = function(){ b.setAttribute('aria-pressed', b.classList.contains(pair[1]) ? 'true' : 'false'); };
      new MutationObserver(s).observe(b, {attributes:true, attributeFilter:['class']}); s();
    });
  });

  /* Text alternatives for canvases and diagrams */
  (C.img || []).forEach(function(pair){
    $$(pair[0]).forEach(function(el, i){
      var d = (typeof pair[1] === 'function') ? pair[1](el, i) : pair[1];
      el.setAttribute('role', 'img'); el.setAttribute('aria-label', d);
    });
  });
  (C.groups || []).forEach(function(pair){
    $$(pair[0]).forEach(function(el){ el.setAttribute('role', 'group'); el.setAttribute('aria-label', pair[1]); });
  });
  (C.hidden || []).forEach(function(sel){ $$(sel).forEach(function(el){ el.setAttribute('aria-hidden', 'true'); }); });

  /* Announce result text when it changes after the student does something */
  var regions = [];
  function txt(el){ return clean(el.innerText !== undefined ? el.innerText : el.textContent); }
  (C.live || []).forEach(function(sel){ $$(sel).forEach(function(el){ regions.push({el:el, last:txt(el), dirty:false}); }); });
  var timer = null, first = 0;
  function flush(){
    first = 0;
    var parts = regions.filter(function(r){ return r.dirty && r.el.offsetParent !== null && r.last; }).map(function(r){ return r.last; });
    regions.forEach(function(r){ r.dirty = false; });
    if (parts.length) say(parts.join('. '));
  }
  function check(){
    var changed = false;
    regions.forEach(function(r){ var t = txt(r.el); if (t !== r.last){ r.last = t; r.dirty = true; changed = true; } });
    if (!changed) return;
    var now = performance.now();
    if (now - lastAct > 12000){ regions.forEach(function(r){ r.dirty = false; }); return; }
    if (!first) first = now;
    clearTimeout(timer);
    timer = setTimeout(flush, Math.max(0, Math.min(900, 4000 - (now - first))));
  }
  regions.forEach(function(r){ new MutationObserver(check).observe(r.el, {childList:true, characterData:true, subtree:true}); });
})();
</script>
</body>
</html>
